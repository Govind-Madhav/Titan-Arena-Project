server:
  port: 8080

spring:
  application:
    name: titan-arena-tournament-engine

  # PostgreSQL — same DB as Node.js backend (read tournament data)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:esports_tournament}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:root1}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none          # Never touch Node.js-managed schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    consumer:
      group-id: tournament-engine
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# App-level config
app:
  kafka:
    topics:
      tournament-created: tournament.created
      tournament-started: tournament.started
      match-scheduled: match.scheduled
      match-completed: match.completed
  bracket:
    win-points: 100
    tournament-win-bonus: 500
