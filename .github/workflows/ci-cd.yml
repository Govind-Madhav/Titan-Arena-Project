name: Titan Arena CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'CODE/BACKEND/**'
      - 'CODE/FRONTEND/**'
      - 'CODE/JAVA-TOURNAMENT-ENGINE/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'CODE/BACKEND/**'
      - 'CODE/FRONTEND/**'
      - 'CODE/JAVA-TOURNAMENT-ENGINE/**'
      - '.github/workflows/ci-cd.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/esports-backend
  IMAGE_NAME_JAVA: ${{ github.repository }}/esports-tournament-engine
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/esports-frontend

jobs:
  # ─── JOB 1: Test & Lint Node.js Backend ──────────────────────────────────────
  test-backend:
    name: Test Node.js Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CODE/BACKEND
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: CODE/BACKEND/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and Verify Compile
        run: |
          # Add npm run lint here once configured
          node --check src/index.js

  # ─── JOB 2: Build & Test Java Tournament Engine ──────────────────────────────
  test-java-engine:
    name: Test Spring Boot Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CODE/JAVA-TOURNAMENT-ENGINE
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        run: mvn clean package

  # ─── JOB 3: Build & Test React Frontend ──────────────────────────────────────
  test-frontend:
    name: Test React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CODE/FRONTEND
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: CODE/FRONTEND/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vite SPA
        run: npm run build

  # ─── JOB 4: Build Docker Containers & Push to GHCR ───────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    needs: [test-backend, test-java-engine, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}

      - name: Extract metadata for Docker (Java Engine)
        id: meta-java
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_JAVA }}

      - name: Extract metadata for Docker (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}

      # Build Backend Image
      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./CODE/BACKEND
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Java Engine Image
      - name: Build and push Java Engine Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./CODE/JAVA-TOURNAMENT-ENGINE
          push: true
          tags: ${{ steps.meta-java.outputs.tags }}
          labels: ${{ steps.meta-java.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Frontend Image
      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./CODE/FRONTEND
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
